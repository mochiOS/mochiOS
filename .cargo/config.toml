# Development-tree overrides only. Repository manifests use Git across
# repository boundaries; only OS integration selects sibling checkouts here.
# The exported application SDK carries matching explicit Cargo overrides.
[patch.crates-io]
libc = { path = "libraries/libc" }
mnu-abi = { path = "core/crates/abi" }
viewkit = { path = "libraries/viewkit" }
mochios-mdriver-protocol = { path = "boot/crates/mdriver-protocol" }

[patch."https://github.com/mochiOS/mnu"]
mnu-abi = { path = "core/crates/abi" }
