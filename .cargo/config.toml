# Development-tree overrides only. Keep user/Cargo.toml relocatable so the
# standalone SDK build can use its own explicit source overrides.
[patch.crates-io]
libc = { path = "libraries/libc" }
mnu-abi = { path = "core/crates/abi" }
viewkit = { path = "libraries/viewkit" }

[patch."https://github.com/mochiOS/mnu"]
mnu-abi = { path = "core/crates/abi" }
mnu = { path = "core" }

[patch."https://github.com/mochiOS/libc"]
libc = { path = "libraries/libc" }

[patch."https://github.com/mochiOS/viewkit"]
viewkit = { path = "libraries/viewkit" }

[patch."https://github.com/mochiOS/mBoot"]
mboot-protocol = { path = "services/mboot-protocol" }

[patch."https://github.com/mochiOS/syscalls"]
mochi-user-platform = { path = "user/crates/platform" }
mochi-user-runtime = { path = "user/crates/runtime" }
mochi-user-syscall = { path = "user/crates/syscall" }
mochios-capability-protocol = { path = "user/crates/capability-protocol" }
mochios-filesystem-protocol = { path = "user/crates/filesystem-protocol" }
mochios-workspace-protocol = { path = "user/crates/workspace-protocol" }
mochios-posix-protocol = { path = "user/crates/posix-protocol" }
mochios-posix-client = { path = "user/crates/posix-client" }
mochios-user-database = { path = "user/crates/user-database" }
mochios-user-protocol = { path = "user/crates/user-protocol" }
mochios-signature-protocol = { path = "user/crates/signature-protocol" }
mochios-linux-gui-protocol = { path = "user/crates/linux-gui-protocol" }
mochios-linux-portal-protocol = { path = "user/crates/linux-portal-protocol" }
mochios-viewkit-gpu-protocol = { path = "user/crates/viewkit-gpu-protocol" }
mochios-virtio-gpu-protocol = { path = "user/crates/virtio-gpu-protocol" }
mochios-net-device-protocol = { path = "user/crates/net-device-protocol" }
mochios-tls-client = { path = "user/crates/tls-client" }
