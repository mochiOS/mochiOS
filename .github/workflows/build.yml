name: Build mochiOS

on:
  push:
    branches:
      - master

  workflow_dispatch:

  repository_dispatch:
    types:
      - dependency-updated

permissions:
  contents: write

concurrency:
  group: mochios-build-number
  cancel-in-progress: false

jobs:
  build:
    name: Build mochiOS
    runs-on: ubuntu-24.04

    env:
      RUSTUP_TOOLCHAIN: nightly-2026-05-14
      CARGO_TERM_COLOR: always
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Show build trigger
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          
          echo "Event: ${GITHUB_EVENT_NAME}"
          
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            echo "Source repository: ${SOURCE_REPOSITORY}"
            echo "Source commit: ${SOURCE_SHA}"
          else
            echo "Source repository: ${GITHUB_REPOSITORY}"
            echo "Source commit: ${GITHUB_SHA}"
          fi

      - name: Install build dependencies
        run: |
          set -euo pipefail
          
          sudo apt-get update
          
          sudo apt-get install --yes \
            autoconf \
            automake \
            binutils \
            bison \
            build-essential \
            curl \
            dosfstools \
            e2fsprogs \
            fakeroot \
            flex \
            gawk \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtool \
            mtools \
            openssl \
            ovmf \
            perl \
            qemu-system-x86 \
            repo \
            texinfo \
            xz-utils

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" \
            --profile minimal \
            --component rust-src
          
          rustup default "${RUSTUP_TOOLCHAIN}"
          
          rustc --version
          cargo --version

      - name: Initialize repo workspace
        run: |
          set -euo pipefail
          
          git config --global protocol.file.allow always
          
          git branch --force ci-manifest HEAD
          
          repo init \
            --manifest-url="file://${GITHUB_WORKSPACE}" \
            --manifest-branch=ci-manifest \
            --manifest-name=default.xml \
            --depth=1
          
          repo sync \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            --jobs="$(nproc)"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
            cargo-${{ runner.os }}-

      - name: Install Homebrew
        run: |
          set -euo pipefail
          
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          
          if command -v brew >/dev/null 2>&1; then
            BREW_BIN="$(command -v brew)"
          else
            BREW_BIN="/home/linuxbrew/.linuxbrew/bin/brew"
          fi
          
          test -x "${BREW_BIN}"
          
          eval "$("${BREW_BIN}" shellenv)"
          
          {
            echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX}"
            echo "HOMEBREW_CELLAR=${HOMEBREW_CELLAR}"
            echo "HOMEBREW_REPOSITORY=${HOMEBREW_REPOSITORY}"
          } >> "${GITHUB_ENV}"
          
          echo "${HOMEBREW_PREFIX}/bin" >> "${GITHUB_PATH}"
          echo "${HOMEBREW_PREFIX}/sbin" >> "${GITHUB_PATH}"

      - name: Install x86_64 ELF toolchain
        run: |
          set -euo pipefail
          
          brew install x86_64-elf-gcc

      - name: Check build toolchains
        run: |
          set -euo pipefail
          
          command -v rustc
          command -v cargo
          
          command -v x86_64-elf-gcc
          command -v x86_64-elf-ar
          command -v x86_64-elf-ranlib
          command -v x86_64-elf-ld
          command -v x86_64-elf-nm
          command -v x86_64-elf-readelf
          
          rustc --version
          cargo --version
          x86_64-elf-gcc --version

      - name: Build mochiOS
        id: build
        run: |
          set -euo pipefail
          
          bash scripts/ci/build.sh

      - name: QEMU smoke test (TCG)
        run: |
          set -euo pipefail

          make smoke-test-tcg

      - name: Commit build number
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build }}
        run: |
          set -euo pipefail
          
          if [ -z "${BUILD_NUMBER}" ]; then
            echo "Build number output is empty"
            exit 1
          fi
          
          git config user.name "mochiOS Build Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add version.toml
          
          if git diff --cached --quiet; then
            echo "version.toml has no changes"
            exit 0
          fi
          
          git commit \
            -m "build: advance to build ${BUILD_NUMBER} [skip ci]"
          
          git push origin HEAD:master

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mochios-${{ steps.build.outputs.release }}-${{ steps.build.outputs.codename }}-build-${{ steps.build.outputs.build }}
          path: out/artifacts/
          if-no-files-found: error
          retention-days: 14
