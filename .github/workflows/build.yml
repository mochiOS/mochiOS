name: Build mochiOS

on:
  push:
    branches:
      - master

  workflow_dispatch:

  repository_dispatch:
    types:
      - dependency-updated

permissions:
  contents: write

concurrency:
  group: mochios-build-number
  cancel-in-progress: false

jobs:
  build:
    name: Build mochiOS
    runs-on: ubuntu-24.04

    env:
      RUSTUP_TOOLCHAIN: nightly-2026-05-14
      CARGO_TERM_COLOR: always
      CARGO_HOME: /home/runner/.cargo
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Show build trigger
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          
          echo "Event: ${GITHUB_EVENT_NAME}"
          
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            echo "Source repository: ${SOURCE_REPOSITORY}"
            echo "Source commit: ${SOURCE_SHA}"
          else
            echo "Source repository: ${GITHUB_REPOSITORY}"
            echo "Source commit: ${GITHUB_SHA}"
          fi

      - name: Install build dependencies
        run: |
          set -euo pipefail
          
          sudo apt-get update
          
          sudo apt-get install --yes \
            autoconf \
            automake \
            binutils \
            bison \
            build-essential \
            curl \
            dosfstools \
            e2fsprogs \
            fakeroot \
            flex \
            gawk \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtool \
            mtools \
            netcat-openbsd \
            openssl \
            ovmf \
            perl \
            qemu-system-x86 \
            repo \
            strace \
            texinfo \
            xz-utils \
            zstd

          zstd --version
          sha256sum --version

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" \
            --profile minimal \
            --component rust-src
          
          rustup default "${RUSTUP_TOOLCHAIN}"
          
          rustc --version
          cargo --version

      - name: Initialize repo workspace
        run: |
          set -euo pipefail
          
          git config --global protocol.file.allow always
          
          git branch --force ci-manifest HEAD
          
          repo init \
            --manifest-url="file://${GITHUB_WORKSPACE}" \
            --manifest-branch=ci-manifest \
            --manifest-name=default.xml \
            --depth=1
          
          repo sync \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            --jobs="$(nproc)"

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
            cargo-${{ runner.os }}-

      - name: Fetch Cargo dependencies
        run: |
          set -euo pipefail

          cargo_patches=(
            --config "patch.crates-io.libc.path='${GITHUB_WORKSPACE}/libraries/libc'"
            --config "patch.\"https://github.com/mochiOS/libc\".libc.path='${GITHUB_WORKSPACE}/libraries/libc'"
            --config "patch.\"https://github.com/mochiOS/mnu\".mnu-abi.path='${GITHUB_WORKSPACE}/core/crates/abi'"
            --config "patch.\"https://github.com/mochiOS/mBoot\".mboot-protocol.path='${GITHUB_WORKSPACE}/services/mboot-protocol'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochi-user-platform.path='${GITHUB_WORKSPACE}/user/crates/platform'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochi-user-syscall.path='${GITHUB_WORKSPACE}/user/crates/syscall'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochios-capability-protocol.path='${GITHUB_WORKSPACE}/user/crates/capability-protocol'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochios-user-database.path='${GITHUB_WORKSPACE}/user/crates/user-database'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochios-user-protocol.path='${GITHUB_WORKSPACE}/user/crates/user-protocol'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochios-viewkit-gpu-protocol.path='${GITHUB_WORKSPACE}/user/crates/viewkit-gpu-protocol'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochios-virtio-gpu-protocol.path='${GITHUB_WORKSPACE}/user/crates/virtio-gpu-protocol'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochios-linux-gui-protocol.path='${GITHUB_WORKSPACE}/user/crates/linux-gui-protocol'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochios-linux-portal-protocol.path='${GITHUB_WORKSPACE}/user/crates/linux-portal-protocol'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochios-signature-protocol.path='${GITHUB_WORKSPACE}/user/crates/signature-protocol'"
            --config "patch.\"https://github.com/mochiOS/syscalls\".mochios-tls-client.path='${GITHUB_WORKSPACE}/user/crates/tls-client'"
            --config "patch.crates-io.mochios-mdriver-protocol.path='${GITHUB_WORKSPACE}/boot/crates/mdriver-protocol'"
            --config "patch.crates-io.viewkit.path='${GITHUB_WORKSPACE}/libraries/viewkit'"
            --config "patch.\"https://github.com/mochiOS/viewkit\".viewkit.path='${GITHUB_WORKSPACE}/libraries/viewkit'"
          )

          sysroot_manifest="$(rustc "+${RUSTUP_TOOLCHAIN}" --print sysroot)/lib/rustlib/src/rust/library/sysroot/Cargo.toml"
          echo "[fetch] ${sysroot_manifest}"
          cargo "+${RUSTUP_TOOLCHAIN}" fetch --locked --manifest-path "${sysroot_manifest}"

          for manifest in \
            libraries/viewkit/Cargo.toml \
            applications/file/Cargo.toml
          do
            echo "[fetch] ${manifest}"
            cargo fetch "${cargo_patches[@]}" --manifest-path "${manifest}"
          done

          while IFS= read -r directory; do
            ancestor="$(dirname "${directory}")"
            while [ "${ancestor}" != "." ] && [ "${ancestor}" != "/" ]; do
              if [ -f "${ancestor}/Cargo.lock" ]; then
                echo "[skip] ${directory}: covered by ${ancestor}/Cargo.lock"
                continue 2
              fi
              ancestor="$(dirname "${ancestor}")"
            done

            manifest="${directory}/Cargo.toml"
            if [ -f "${manifest}" ]; then
              echo "[fetch] ${manifest}"
              cargo fetch "${cargo_patches[@]}" --manifest-path "${manifest}"
            fi
          done < <(
            find . \
              -name Cargo.lock \
              -type f \
              -not -path './.repo/*' \
              -not -path './libraries/rust/*' \
              -not -path './out/*' \
              -printf '%h\n' | sort -u
          )

      - name: Install Homebrew
        run: |
          set -euo pipefail
          
          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          
          if command -v brew >/dev/null 2>&1; then
            BREW_BIN="$(command -v brew)"
          else
            BREW_BIN="/home/linuxbrew/.linuxbrew/bin/brew"
          fi
          
          test -x "${BREW_BIN}"
          
          eval "$("${BREW_BIN}" shellenv)"
          
          {
            echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX}"
            echo "HOMEBREW_CELLAR=${HOMEBREW_CELLAR}"
            echo "HOMEBREW_REPOSITORY=${HOMEBREW_REPOSITORY}"
          } >> "${GITHUB_ENV}"
          
          echo "${HOMEBREW_PREFIX}/bin" >> "${GITHUB_PATH}"
          echo "${HOMEBREW_PREFIX}/sbin" >> "${GITHUB_PATH}"

      - name: Install x86_64 ELF toolchain
        run: |
          set -euo pipefail
          
          brew install x86_64-elf-gcc

      - name: Install mmake
        run: cargo install --locked --path tools/mmake

      - name: Check build toolchains
        run: |
          set -euo pipefail
          
          command -v rustc
          command -v cargo
          command -v mmake
          
          command -v x86_64-elf-gcc
          command -v x86_64-elf-ar
          command -v x86_64-elf-ranlib
          command -v x86_64-elf-ld
          command -v x86_64-elf-nm
          command -v x86_64-elf-readelf
          
          rustc --version
          cargo --version
          mmake --version
          x86_64-elf-gcc --version

      - name: Build mochiOS
        id: build
        run: |
          set -euo pipefail
          
          bash scripts/ci/build.sh

      - name: Commit build number
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build }}
        run: |
          set -euo pipefail
          
          if [ -z "${BUILD_NUMBER}" ]; then
            echo "Build number output is empty"
            exit 1
          fi
          
          git config user.name "mochiOS Build Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add version.toml
          
          if git diff --cached --quiet; then
            echo "version.toml has no changes"
            exit 0
          fi
          
          git commit \
            -m "build: advance to build ${BUILD_NUMBER} [skip ci]"
          
          git push origin HEAD:master

      - name: Prepare initial-installation Artifact
        id: initial_install
        env:
          RELEASE: ${{ steps.build.outputs.release }}
          BUILD: ${{ steps.build.outputs.build }}
          SOURCE_CHANNEL: ${{ steps.build.outputs.channel }}
        run: |
          set -euo pipefail

          case "${SOURCE_CHANNEL}" in
            developer-preview) channel=developer_preview ;;
            beta|stable) channel="${SOURCE_CHANNEL}" ;;
            *) echo "Unsupported release channel: ${SOURCE_CHANNEL}" >&2; exit 1 ;;
          esac

          # This workflow currently builds only the x86_64 image/BOOTX64.EFI.
          architecture=x86_64
          bash scripts/ci/package-initial-install.sh \
            out/artifacts/disk.img version.toml release-artifact \
            "${RELEASE}" "${BUILD}"

          {
            echo "version=${RELEASE}"
            echo "build=${BUILD}"
            echo "channel=${channel}"
            echo "architecture=${architecture}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare normal-update Artifact
        id: normal_update
        shell: bash
        env:
          RELEASE: ${{ steps.build.outputs.release }}
          BUILD: ${{ steps.build.outputs.build }}
          SOURCE_CHANNEL: ${{ steps.build.outputs.channel }}
        run: |
          set -euo pipefail

          case "${SOURCE_CHANNEL}" in
            developer-preview) channel=developer_preview ;;
            beta|stable) channel="${SOURCE_CHANNEL}" ;;
            *) echo "Unsupported release channel: ${SOURCE_CHANNEL}" >&2; exit 1 ;;
          esac

          # This workflow currently builds only x86_64 update payloads.
          architecture=x86_64

          mmake normal-update-payload
          test -s out/mmake/image/mochios-update.moupdate

          rm -rf normal-update-artifact
          mkdir -p normal-update-artifact
          cp out/mmake/image/mochios-update.moupdate \
            normal-update-artifact/mochios-update.moupdate

          (
            cd normal-update-artifact
            sha256sum mochios-update.moupdate \
              > mochios-update.moupdate.sha256
            sha256sum --check mochios-update.moupdate.sha256
          )

          {
            echo "version=${RELEASE}"
            echo "build=${BUILD}"
            echo "channel=${channel}"
            echo "architecture=${architecture}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload development artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mochios-${{ steps.build.outputs.release }}-${{ steps.build.outputs.codename }}-build-${{ steps.build.outputs.build }}-development
          path: out/artifacts/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload initial-installation Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mochios-${{ steps.initial_install.outputs.version }}-${{ steps.initial_install.outputs.build }}-${{ steps.initial_install.outputs.channel }}-${{ steps.initial_install.outputs.architecture }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Upload normal-update Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mochios-${{ steps.normal_update.outputs.version }}-${{ steps.normal_update.outputs.build }}-${{ steps.normal_update.outputs.channel }}-${{ steps.normal_update.outputs.architecture }}-update
          path: normal-update-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
