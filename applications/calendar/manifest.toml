format = 1

[package]
provenance = "built-in"
id = "org.mochios.calendar"
name = "Calendar"
version = "0.1.0"
revision = 1
vendor = "mochiOS"
kind = "application"
architecture = "x86_64"
abi = "mochios-1"

[application]
entry = "entry.elf"
description = "Your days and appointments"
icon = "appicon.svg"
resources = ["appicon.svg"]

[[binary]]
path = "/system/applications/Calendar.app/entry.elf"
kind = "application"
requires = ["ipc.client", "ipc.server", "window.create", "fs.read.user", "fs.write.user"]
