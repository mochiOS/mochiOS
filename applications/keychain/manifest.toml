format = 1

[package]
provenance = "built-in"
id = "org.mochios.keychain"
name = "Keychain"
version = "0.1.0"
revision = 1
vendor = "mochiOS"
kind = "application"
architecture = "x86_64"
abi = "mochios-1"

[application]
entry = "entry.elf"
description = "Manage local passwords and application secrets"

[[binary]]
path = "/system/applications/Keychain.app/entry.elf"
kind = "application"
requires = ["ipc.client", "ipc.server", "window.create", "keychain.access", "keychain.manage", "process.inspect"]
